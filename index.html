<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanMap</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            padding: 60px 0;
        }
        header h1 {
            font-size: 3rem;
            color: #fff;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.2rem;
            color: #888;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 40px;
        }
        .links a {
            display: block;
            padding: 16px 24px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #e0e0e0;
            text-decoration: none;
            font-size: 1rem;
            transition: background 0.2s, border-color 0.2s;
        }
        .links a:hover {
            background: #222;
            border-color: #555;
        }
        footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px 0;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FanMap</h1>
            <p>Taraftarların buluşma noktası</p>
        </header>
        <div class="links">
            <a href="privacy-policy.html">Gizlilik Politikası / Privacy Policy</a>
            <a href="terms-of-service.html">Kullanım Koşulları / Terms of Service</a>
            <a href="account-deletion.html">Hesap Silme / Account Deletion</a>
        </div>
        <footer>
            <p>&copy; 2026 FanMap. Tüm hakları saklıdır.</p>
        </footer>
    </div>
</body>
</html>
