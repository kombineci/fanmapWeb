<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanMap'i İndir</title>
    <!--
      Reklam / paylaşım bağlantısı: https://fanmaptr.com/indir
      Telefonu tanıyıp kendi mağazasına gönderiyor (iPhone/iPad → App Store,
      Android → Google Play). Masaüstünde ya da tanınmayan cihazda iki düğme kalıyor.

      🔴 Mağaza adresi BURADA YOK — `stores.js`'ten okunuyor (tek kaynak kuralı).

      Kampanya ölçümü: bağlantıya `?utm_source=instagram&utm_campaign=<ad>` eklenirse
      bu değerler Play'e `referrer` olarak geçiyor → Play Console › Kullanıcı edinme
      raporunda kaynak olarak görünüyor. App Store tarafı bunu okumuyor.

      Arama motoru dizinine girmesin: ana sayfanın kopyası değil, geçiş sayfası.
    -->
    <meta name="robots" content="noindex">
    <meta name="description" content="FanMap'i App Store veya Google Play'den indir.">
    <meta property="og:title" content="FanMap'i İndir — Türkiye'nin Taraftar Haritası">
    <meta property="og:description" content="Gerçek zamanlı XOX & 321 düelloları, futbol quizleri ve 81 ilde taraftar haritası.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://fanmaptr.com/icon-512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:url" content="https://fanmaptr.com/indir/">
    <meta property="og:site_name" content="FanMap">
    <meta property="og:locale" content="tr_TR">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#6366f1">
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/fonts/space-grotesk.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --ink:    #14152a;
            --muted:  #6b6c85;
            --line:   #e9e8f5;
            --indigo: #6366f1;
            --font: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px 16px; text-align: center;
            font-family: var(--body); color: var(--ink); line-height: 1.6;
            background: linear-gradient(160deg, #f3f2ff 0%, #ffffff 55%, #ecfeff 100%);
            -webkit-font-smoothing: antialiased;
        }
        main { max-width: 420px; width: 100%; }
        .logo { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 14px 34px rgba(80,70,229,.25); }
        h1 { font-family: var(--font); font-size: 1.7rem; line-height: 1.2; margin: 22px 0 8px; }
        p { color: var(--muted); }
        .stores { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
        .store {
            display: inline-flex; align-items: center; justify-content: center; gap: 11px;
            padding: 13px 22px; border-radius: 14px; text-decoration: none;
            background: var(--ink); color: #fff; font-weight: 600;
            box-shadow: 0 10px 26px rgba(20,21,42,.22);
        }
        .store svg { width: 24px; height: 24px; }
        .store span { text-align: left; }
        .store small { display: block; font-size: .66rem; opacity: .7; font-weight: 500; line-height: 1; margin-bottom: 2px; }
        .store b { font-size: 1rem; font-weight: 700; }
        .store[hidden] { display: none; }
        .home { display: inline-block; margin-top: 26px; color: var(--indigo); font-weight: 600; text-decoration: none; font-size: .92rem; }
    </style>
</head>
<body>
<main>
    <img class="logo" src="/icon-192.png" alt="FanMap" width="88" height="88">
    <h1 id="baslik">FanMap'i İndir</h1>
    <p id="alt">Türkiye'nin taraftar haritası. Bilgini kanıtla, şehrini takımının rengine boya.</p>

    <div class="stores">
        <a class="store" id="ios" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 12.04c-.03-2.83 2.31-4.19 2.42-4.25-1.32-1.93-3.38-2.2-4.11-2.23-1.75-.18-3.41 1.03-4.29 1.03-.88 0-2.25-1.01-3.7-.98-1.9.03-3.66 1.11-4.64 2.81-1.98 3.43-.51 8.5 1.42 11.28.94 1.36 2.06 2.89 3.53 2.83 1.42-.06 1.96-.92 3.67-.92 1.71 0 2.2.92 3.7.89 1.53-.03 2.5-1.39 3.43-2.76 1.08-1.58 1.53-3.11 1.55-3.19-.03-.02-2.98-1.14-3.01-4.53zM14.28 3.9c.78-.94 1.3-2.26 1.16-3.57-1.12.05-2.48.75-3.28 1.69-.72.83-1.35 2.16-1.18 3.43 1.25.1 2.52-.63 3.3-1.55z"/></svg>
            <span><small>İndir</small><b>App Store</b></span>
        </a>
        <a class="store" id="android" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
            <span><small>İndir</small><b>Google Play</b></span>
        </a>
    </div>

    <a class="home" href="/">fanmaptr.com'u ziyaret et →</a>
</main>

<script src="/stores.js"></script>
<script>
(function () {
    var S = window.FANMAP_STORES || {};
    var ua = navigator.userAgent || '';
    // 404.html ile aynı algılama: iPadOS 13+ kendini "Macintosh" diye tanıtıyor,
    // dokunmatik nokta sayısı ayırıyor.
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1);
    var isAndroid = /Android/.test(ua);

    // utm_* → Play `referrer`. İç değerler bir kez, bütün dize bir kez daha
    // kodlanıyor: Play referrer'ı tek parametre olarak alıp kendisi çözüyor.
    var play = S.android || '';
    if (play) {
        var q = location.search.replace(/^\?/, '').split('&'), ref = [];
        for (var i = 0; i < q.length; i++) {
            if (/^utm_(source|medium|campaign|content|term)=./.test(q[i])) ref.push(q[i]);
        }
        if (ref.length) play += '&referrer=' + encodeURIComponent(ref.join('&'));
    }

    var hedef = isIOS ? S.ios : (isAndroid ? play : '');

    var ios = document.getElementById('ios');
    var android = document.getElementById('android');
    if (S.ios) ios.href = S.ios;
    if (play) android.href = play;
    // Telefonda yalnız kendi mağazası; masaüstünde ikisi de.
    ios.hidden = !S.ios || isAndroid;
    android.hidden = !play || isIOS;

    if (hedef) {
        document.getElementById('baslik').textContent = 'Mağazaya yönlendiriliyorsun…';
        document.getElementById('alt').textContent = 'Açılmazsa aşağıdaki düğmeye dokun.';
        // replace: geri tuşu bu sayfaya dönüp kullanıcıyı yeniden mağazaya atmasın.
        location.replace(hedef);
    }
})();
</script>
</body>
</html>
